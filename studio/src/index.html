<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triune Studio – Advanced AI Engine & Visual Research IDE</title>
  
  <!-- Classic editorial fonts; the Modern edition uses Inter for all workspace text. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      if (document.getElementById('triune-runtime-error')) return false;
      var errDiv = document.createElement('div');
      errDiv.id = 'triune-runtime-error';
      errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fcfbfa;color:#9a3412;padding:30px;font-family:Fira Code,monospace;font-size:14px;z-index:99999;overflow:auto;border:4px solid #ded9cd;';
      var title = document.createElement('h2');
      title.textContent = 'Studio encountered a script error';
      var detail = document.createElement('pre');
      detail.style.cssText = 'white-space:pre-wrap;margin-top:16px;';
      detail.textContent = String(msg) + '\n' + String(url) + ':' + lineNo + ':' + columnNo + (error && error.stack ? '\n' + error.stack : '');
      errDiv.appendChild(title);
      errDiv.appendChild(detail);
      (document.body || document.documentElement).appendChild(errDiv);
      return false;
    };
  </script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
