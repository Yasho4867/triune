<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triune Studio – Advanced AI Engine & Visual Research IDE</title>
  
  <!-- Classic & Editorial Papery Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#b91c1c;padding:30px;font-family:monospace;font-size:14px;z-index:99999;overflow:auto;';
      errDiv.innerHTML = '<h2>⚠️ JavaScript Runtime Error</h2><p><b>Msg:</b> ' + msg + '</p><p><b>URL:</b> ' + url + '</p><p><b>Line:</b> ' + lineNo + ' <b>Col:</b> ' + columnNo + '</p><pre>' + (error && error.stack ? error.stack : '') + '</pre>';
      document.body.appendChild(errDiv);
      return false;
    };
  </script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
