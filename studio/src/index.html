<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Triune AI Studio – Native AI Engine & Visual Research IDE</title>
  <link rel="icon" type="image/svg+xml" href="triune-logo.svg">
  <link rel="alternate icon" type="image/png" href="triune-logo.png">
  
  <!-- Shared typography for every Studio page and theme. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=2.4.1">
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      if (document.getElementById('triune-runtime-error')) return false;
      var errDiv = document.createElement('div');
      errDiv.id = 'triune-runtime-error';
      errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fcfbfa;color:#9a3412;padding:30px;font-family:Fira Code,monospace;font-size:14px;z-index:99999;overflow:auto;border:4px solid #ded9cd;';
      var title = document.createElement('h2');
      title.textContent = 'Studio encountered a script error';
      var detail = document.createElement('pre');
      detail.style.cssText = 'white-space:pre-wrap;margin-top:16px;';
      detail.textContent = String(msg) + '\n' + String(url) + ':' + lineNo + ':' + columnNo + (error && error.stack ? '\n' + error.stack : '');
      errDiv.appendChild(title);
      errDiv.appendChild(detail);
      (document.body || document.documentElement).appendChild(errDiv);
      return false;
    };
  </script>
  <script>
    // Guard against unintended browser UI viewport zooming from touchpad pinch, Ctrl+Scroll, or hotkeys
    (function() {
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          if (!e.target || !e.target.closest || !e.target.closest('.node-grid-area')) {
            e.preventDefault();
          }
        }
      }, { passive: false });

      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      window.addEventListener('keydown', function(e) {
        if (e.ctrlKey || e.metaKey) {
          var k = e.key;
          if (k === '+' || k === '-' || k === '=' || k === '_' || k === '0' ||
              e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 107 || e.keyCode === 109 || e.keyCode === 96 || e.keyCode === 48) {
            e.preventDefault();
          }
        }
      });
    })();
  </script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js?v=2.4.1"></script>
</body>
</html>
