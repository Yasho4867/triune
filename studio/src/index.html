<!DOCTYPE html>
<html lang="en" data-theme="hypnagogic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-b+D8l7pD2+xi93JqHMIn0+nZ/ZbCcUpXlvEjczXuX/0=' 'sha256-UBXW1QbHfRlHwPcM+yVSaCjGw6/7cSVJ5QSVEVtxstI=' 'sha256-JB/BYLT8zNL/pmby6xCvLXid/TRYnqeAVDIhYcK/WP8='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Polysom Studio – Lucid Machines Engine &amp; Visual Research IDE</title>
  <link rel="icon" type="image/svg+xml" href="polysom-logo.svg">
  <!-- Local font stack (Outfit, Inter, Fira Code) and zero-FOUC theme bootstrap. -->
  <script>(function() {
  var valid = {
    hypnagogic: 'dark',
    phosphene: 'dark',
    pareidolia: 'dark',
    afterimage: 'dark',
    mirage: 'light',
    euphoria: 'light'
  };
  var legacy = {
    'obsidian-glass': 'hypnagogic',
    'cyberpunk-dark': 'hypnagogic',
    'emerald-terminal': 'phosphene',
    'modern-dark': 'hypnagogic',
    'modern-forest': 'pareidolia',
    'classic-dark': 'afterimage',
    'modern-light': 'mirage',
    'editorial-cream': 'mirage',
    'classic-light': 'mirage',
    'editorial-paper': 'mirage'
  };
  var chosen = 'hypnagogic';
  try {
    var raw = window.localStorage.getItem('lucid_machines.studio.theme') ||
              window.localStorage.getItem('triune.studio.theme') || '';
    if (legacy[raw]) raw = legacy[raw];
    if (valid[raw] || raw.indexOf('custom-') === 0) chosen = raw;
  } catch (_) {}
  var root = document.documentElement;
  root.setAttribute('data-theme', chosen);
  if (valid[chosen]) {
    root.style.colorScheme = valid[chosen];
  }
})();</script>
  <link rel="stylesheet" href="style.css?v=1.0.0">
  <script>window.onerror = function(msg, url, lineNo, columnNo, error) {
  if (document.getElementById('polysom-runtime-error')) return false;
  var theme = document.documentElement.getAttribute('data-theme') || 'hypnagogic';
  var isLight = (theme === 'mirage' || theme === 'euphoria');
  var errDiv = document.createElement('div');
  errDiv.id = 'polysom-runtime-error';
  errDiv.style.cssText = 'position:fixed;inset:0;padding:30px;font-family:"Fira Code","Cascadia Code",Consolas,monospace;font-size:14px;z-index:99999;overflow:auto;' +
    (isLight
      ? 'background:#faf5ec;color:#991b1b;border:4px solid #dfd0ba;'
      : 'background:#0b0a14;color:#fda4af;border:4px solid #2d294a;');
  var title = document.createElement('h2');
  title.textContent = 'Polysom Studio encountered a script error';
  var detail = document.createElement('pre');
  detail.style.cssText = 'white-space:pre-wrap;margin-top:16px;';
  detail.textContent = String(msg) + '\n' + String(url) + ':' + lineNo + ':' + columnNo + (error && error.stack ? '\n' + error.stack : '');
  errDiv.appendChild(title);
  errDiv.appendChild(detail);
  (document.body || document.documentElement).appendChild(errDiv);
  return false;
};</script>
  <script>(function() {
  window.addEventListener('wheel', function(e) {
    if (e.ctrlKey) {
      if (!e.target || !e.target.closest || !e.target.closest('.node-grid-area, .ps-dag-canvas')) {
        e.preventDefault();
      }
    }
  }, { passive: false });

  document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
      var k = e.key;
      if (k === '+' || k === '-' || k === '=' || k === '_' || k === '0' ||
          e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 107 || e.keyCode === 109 || e.keyCode === 96 || e.keyCode === 48) {
        e.preventDefault();
      }
    }
  });
})();</script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
