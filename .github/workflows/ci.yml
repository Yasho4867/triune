name: Triune CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[all]
        pip install ruff build

    - name: Lint with ruff
      run: |
        ruff check --select=E9,F63,F7,F82 .

    - name: Compile source code smoke check
      run: |
        python -m compileall triune

    - name: Run Core Test Suite (CPU)
      run: |
        python -m unittest discover tests

    - name: Validate DAG Parser & Typed Port Contracts
      run: |
        python -c "from triune.plugins.node_schema import PortType, is_port_compatible; from triune.plugins.registry import global_registry; from triune.execution.dag import DAGParser, ExecutionEngine; catalog = global_registry.get_catalog(); assert len(catalog) >= 30, f'Expected at least 30 nodes, got {len(catalog)}'; print(f'Validated {len(catalog)} registered DAG nodes with typed contracts.')"

    - name: Build wheel and sdist smoke test
      run: |
        python -m build --sdist --wheel
