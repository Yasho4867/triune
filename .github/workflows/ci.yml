name: Lucid Machines CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[all]
        pip install ruff build

    - name: Build Native C ABI Engine
      run: |
        python csrc/build_native.py

    - name: Lint with ruff
      run: |
        ruff check --select=E9,F63,F7,F82 .

    - name: Compile source code smoke check
      run: |
        python -m compileall lucid_machines

    - name: Run Core Test Suite (CPU)
      run: |
        python -m unittest discover tests

    - name: Verify Mathematical Invariants & Benchmark Validity
      run: |
        python -m unittest tests.test_pipeline_integration tests.test_self_speculative_decoding tests.test_staging_invariants tests.test_triangular_core_integrity tests.test_benchmark_validity

    - name: Validate DAG Parser & Typed Port Contracts
      run: |
        python -c "from lucid_machines.plugins.node_schema import PortType, is_port_compatible; from lucid_machines.plugins.registry import global_registry; from lucid_machines.execution.dag import DAGParser, ExecutionEngine; catalog = global_registry.get_catalog(); assert len(catalog) >= 30, f'Expected at least 30 nodes, got {len(catalog)}'; print(f'Validated {len(catalog)} registered DAG nodes with typed contracts.')"

    - name: Build wheel and sdist smoke test
      run: |
        python -m build --sdist --wheel

    - name: Install built wheel and verify packaged CLI modules
      run: |
        python -m pip install --no-deps --target "$RUNNER_TEMP/lucid-machines-wheel" dist/*.whl
        python -m venv "$RUNNER_TEMP/lucid-machines-venv"
        "$RUNNER_TEMP/lucid-machines-venv/bin/pip" install --no-deps dist/*.whl
        "$RUNNER_TEMP/lucid-machines-venv/bin/kcx" --help
        "$RUNNER_TEMP/lucid-machines-venv/bin/lucid-machines" --help
        cd "$RUNNER_TEMP"
        PYTHONPATH="$RUNNER_TEMP/lucid-machines-wheel" python -c "import scripts.train, scripts.chat, lucid_machines.cli; print('Wheel CLI modules import from the installed artifact.')"
