<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lucid Machines v1.0.0 Benchmark and Architecture Card">
  <title>Lucid Machines v1.0.0 — 5-Tier Verified Benchmark &amp; CentroidSteer R2 Summary Card</title>
  <rect x="0" y="0" width="1200" height="630" fill="#0B0F17" stroke="#1E293B" stroke-width="4"/>

  <rect x="40" y="36" width="1120" height="86" rx="12" fill="#111827" stroke="#1E293B" stroke-width="2"/>
