[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-machines"
version = "1.0.0"
description = "LucidMachines — High-performance framework for Triune multi-exit Mixture-of-Experts language models, native C/CUDA/Triton operators, layer streaming, and 3-tier optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lucid Machines" }
]
keywords = [
    "deep-learning",
    "transformer",
    "mixture-of-experts",
    "gla",
    "muon",
    "centroid-steer",
    "layer-streaming",
    "early-exit",
    "fp8",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "datasets>=2.0.0",
    "tokenizers>=0.13.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=12.0",
    "httpx>=0.24.0",
    "pywebview>=4.0.0",
    "keyring>=25.0.0",
    "cryptography>=41.0.0",
    "wandb>=0.15.0",
]
train = [
    "wandb>=0.15.0",
    "bitsandbytes>=0.41.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=12.0",
    "httpx>=0.24.0",
    "pywebview>=4.0.0",
    "keyring>=25.0.0",
    "cryptography>=41.0.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "wandb>=0.15.0",
    "bitsandbytes>=0.41.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://lucidmachines.co"
Documentation = "https://github.com/lucid-machines/triune#readme"
Repository = "https://github.com/lucid-machines/triune"
Issues = "https://github.com/lucid-machines/triune/issues"

[project.scripts]
kcx = "lucid_machines.cli:main"
lucid-machines = "lucid_machines.cli:main"
polysom = "lucid_machines.cli:main"
triune = "lucid_machines.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lucid_machines", "lucid_machines.*", "triune", "scripts", "scripts.*", "studio.src", "studio.src.*"]
exclude = ["tests*", "studio.windows*", "studio.studio_env*", "studio.publish*", "studio.installer*", "models*", "triune_fast*"]

[tool.setuptools.package-data]
"lucid_machines.ops" = ["*.dll", "*.so", "*.dylib", "*.h", "*.def"]
"lucid_machines" = ["*.json"]
"studio.src" = ["*", "*/*", "*/*/*"]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F403", "F405", "E402", "E741", "F841", "W291", "E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
